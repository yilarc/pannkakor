  <meta charset="utf-8" />

<body class="suggestions">
    <a href="#suggestions-content" class="skip-link">
         Hoppa till huvudinnehåll</a>

    <header class="header"> 
       <nav class="navigation">
           <a href="Index.html">Receptbanken</a>
           <div class="menu">
             <a href="Recept.html">Recept</a>
             <a href="Om-oss.html">Om oss</a>
             <a href="Suggestions.html">Förslag</a>
           </div>
       </nav>
    </header> 

    <main class="page" id="suggestions-content">

        <h1>Dela ditt recept</h1>
        <h2>Kort intro till formuläret</h2>
        
        <form action="" method="get">
            <fieldset>
                <legend>Om receptet</legend>
                <div> 
                    <label for="name">Receptets namn</label>
                </div>
                <div> 
                    <input type="text" id="name" name="name" placeholder="Lasagne" required minlength="3" maxlength="30">
                </div>
                <div> 
                    <label for="category">Kategori</label>
                </div>
                <div> 
                    <select id="category" name="category">
                        <option value="">Välj ett alternativ</option>
                        <option value="breakfast">Frukost</option>
                        <option value="dinner">Middag</option>
                        <option value="dessert">Efterrätt</option>
                        <option value="fika">Fika</option>
                    </select>
                </div>
                <div> 
                    <label for="time">Tid i minuter</label>
                    <input type="text" id="time" name="time" required>
                </div>
                <div>
                    <label for="portions">Antal portioner</label>
                    <input type="text" id="portions" name="portions" required>
                </div>
            </fieldset> 

            <fieldset>
                <legend>Svårighetsgrad</legend>
                <div>
                  <input type="radio" id="easy" name="difficulty" value="easy">
                  <label for="east">Lätt</label>

                  <input type="radio" id="intermediate" name="difficulty" value="intermediate">
                  <label for="intermediate">Medel</label>

                  <input type="radio" id="advanced" name="difficulty" value="advanced">
                  <label for="advanced">Avancerad</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Receptet</legend>
                <div> 
                    <label for="ingredients">Ingredienser</label>
                    <input type="text" id="ingredients" name="ingredients" required>
                    <input type="text" id="ingredients" name="ingredients" required>
                    <input type="text" id="ingredients" name="ingredients">
                    <input type="text" id="ingredients" name="ingredients">
                    <input type="text" id="ingredients" name="ingredients">
                    <input type="text" id="ingredients" name="ingredients">
                </div>
                <div>
                    <label for="instructions">Gör så här</label>
                    <input type="text" id="steps" name="ingredients" required>
                    <input type="text" id="steps" name="ingredients" required>
                    <input type="text" id="steps" name="ingredients">
                    <input type="text" id="steps" name="ingredients">
                    <input type="text" id="steps" name="ingredients">
                    <input type="text" id="steps" name="ingredients">
                </div>
            </fieldset>

            <fieldset>
                <legend>Om dig</legend>
                <div> 
                    <label for="name">Ditt namn</label>
                </div>
                <div>     
                    <input type="text" id="name" name="name" required minlength="2" maxlength="30" autocomplete="name">
                </div>
                <div> 
                    <label for="email">E-post</label>
                </div>
                <div> 
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required minlength="3" maxlength="30" autocomplete="email">
                </div>
            </fieldset>

            <button type="submit">Skicka recept</button>
        </form>
    </main>
